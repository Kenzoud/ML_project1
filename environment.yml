# Same versions as the course grading environment
# (ML_course/projects/project1/grading_tests/environment.yml),
# minus scikit-learn, which is not allowed in this project and has no
# arm64 build of 1.1.2 on the defaults channel.
name: ml-project1
channels:
  - defaults
dependencies:
  - python=3.9
  - numpy=1.23.1
  - matplotlib=3.5.2
  - seaborn=0.11.2
  - pytest=7.1.2
  - gitpython=3.1.18
  - black=22.6.0
  - pytest-mock=3.7.0
  - jupyter
